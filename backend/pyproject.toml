[project]
name = "stechgrow-backend"
version = "0.1.0"
description = "Stechgrow OS Modular Backend Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pytest>=8.3.0",
    "scikit-learn",
    "google-genai",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
